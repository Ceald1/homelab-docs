loki:
  #  image:
  #    tag: "3.2.1"
  commonConfig:
    replication_factor: 1

  auth_enabled: false

  isDefault: false

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: filesystem
    bucketNames:
      chunks: chunks
      ruler: ruler
      admin: admin

  limits_config:
    allow_structured_metadata: true

deploymentMode: SingleBinary

singleBinary:
  replicas: 1

gateway:
  enabled: false

read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

querier:
  replicas: 0

queryFrontend:
  replicas: 0

queryScheduler:
  replicas: 0

ingester:
  replicas: 0

distributor:
  replicas: 0

compactor:
  replicas: 0

lokiCanary:
  enabled: false
chunksCache:
  enabled: false

resultsCache:
  enabled: false
test:
  enabled: false

monitoring:
  dashboards:
    enabled: false
  rules:
    enabled: false
  serviceMonitor:
    enabled: false

promtail:
  config:
    snippets:
      extraScrapeConfigs: |
        - job_name: tetragon
          static_configs:
            - targets:
                - localhost
              labels:
                job: tetragon
                __path__: /var/run/cilium/tetragon/tetragon.log
          pipeline_stages:
            - json:
                expressions:
                  process_exec: process_exec
                  process_exit: process_exit
                  process_kprobe: process_kprobe
  extraVolumeMounts:
    - mountPath: /var/run/cilium/tetragon
      name: tetragon-logs
      readOnly: true
  extraVolumes:
    - hostPath:
        path: /var/run/cilium/tetragon
      name: tetragon-logs
