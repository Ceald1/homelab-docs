driver:
  kind: modern_ebpf
metrics:
  enabled: true
  interval: 1h
  rulesCountersEnabled: true
  resourceUtilizationEnabled: true
  stateCountersEnabled: true
  kernelEventCountersEnabled: true
  libbpfStatsEnabled: true
  pluginsMetricsEnabled: true
  service:
    create: true
    type: ClusterIP
    ports:
      metrics:
        port: 8765
        targetPort: 8765
        protocol: "TCP"

serviceMonitor:
  create: true
  path: /metrics
  interval: 15s
  scheme: http
  endpointPort: "metrics"
  namespaceSelector:
    matchNames:
      - falco
#serviceMonitor:
#  create: true
#  path: /metrics
#  interval: 15s
#  scheme: http
#  endpointPort: "metrics"

grafana:
  dashboards:
    enabled: true
    configMaps:
      falco:
        name: falco-grafana-dashboard
        namespace: ""
        folder: ""
        folderAnnotation: grafana_dashboard_folder

falco:
  webserver:
    enabled: true
    listen_port: 8765
    prometheus_metrics_enabled: true
falcosidekick:
  enabled: true
  webserver_address: ""
  webserver_port: 2801
  config:
    prometheus:
      enabled: true
      # Falcosidekick exposes its Prometheus metrics on port 2810 by default
  service:
    enabled: true
    type: ClusterIP
    port: 2801
    metricsPort: 2810
  serviceMonitor:
    enabled: true
    create: true
    namespace: monitoring
    interval: 15s
    # Make sure it targets the namespace where falcosidekick is deployed
    namespaceSelector:
      matchNames:
        - falco
