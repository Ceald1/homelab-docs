driver:
  kind: modern_ebpf
json_output: true
json_include_output_property: true
json_include_tags_property: true
stdout_output:
  enabled: true
serviceMonitor:
  enabled: true
  create: true
falco:
  metrics:
    enabled: true
    output_rule: true
    resource_utilization_enabled: true
    interval: 15s

http_output:
  enabled: true
  url: "http://falco-falcosidekick:2801/"
falcosidekick:
  enabled: true
  webui:
    enabled: true

  config:
    loki:
      hostport: http://loki.monitoring.svc.cluster.local:3100
      format: json
falcoctl:
  config:
    artifact:
      install:
        refs:
          - falco-rules:5
          - falco-incubating-rules:2
          - falco-sandbox-rules:2
      follow:
        refs:
          - falco-rules:5
          - falco-incubating-rules:2
          - falco-sandbox-rules:2
